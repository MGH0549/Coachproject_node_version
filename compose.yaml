services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: localdevelopment
      POSTGRES_DB: coaching
      TZ: UTC
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - coaching-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U coach -d coaching']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  coaching-data:
