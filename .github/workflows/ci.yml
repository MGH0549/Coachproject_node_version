name: backend
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: coach
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: coaching_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U coach -d coaching_test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://coach:integration-only@localhost:5432/coaching_test
      TEST_DATABASE_URL: postgresql://coach:integration-only@localhost:5432/coaching_test
      JWT_SECRET: integration-only-secret-with-at-least-32-characters
      APP_ORIGIN: http://localhost:4200
      PUBLIC_APP_URL: http://localhost:4200
      COACH_WHATSAPP: '201000000000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit --audit-level=high
